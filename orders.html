/* OLD CODE SAVE - purana generateInvoiceDirect SAFE - niche naya Restro format */
function generateInvoiceDirect(order){
order=order||{};let items=order.items||order.cart||[];
if(!items.length){alert('Order me items nahi hai');return;}
let jsPDFClass=(window.jspdf&&window.jspdf.jsPDF)?window.jspdf.jsPDF:window.jsPDF;
if(!jsPDFClass){alert('jsPDF load nahi hua - Internet check karo');return;}
let invoiceNo=order.orderId||order.id||'RESTRO'+Date.now();
let dateStr=order.dateStr||new Date().toLocaleString('en-IN');
let customerName=order.customerName||order.name||localStorage.getItem('popup_name')||'Customer';
let mobile=order.mobile||order.customerMobile||order.loginMobile||localStorage.getItem('restro_mobile')||'';
let address=order.address||order.fullAddress||localStorage.getItem('popup_fulladdr')||'Address not added';
let sub=0;items.forEach(it=>sub+=(parseFloat(it.price)||0)*(parseInt(it.qty)||1));
let del=order.deliveryCharge!=null?order.deliveryCharge:(sub>=500?0:80);let grand=order.grandTotal||order.total||sub+del;
let doc=new jsPDFClass('p','mm','a4');let y=15;
doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('RESTRO FOR YOU',14,y);y+=8;
doc.setFontSize(12);doc.text('Invoice',14,y);y+=10;
doc.setFont('helvetica','normal');doc.setFontSize(10);
doc.text('Invoice No: '+invoiceNo,14,y);doc.text('Date: '+dateStr,120,y);y+=6;
doc.text('Customer: '+customerName,14,y);y+=6;
doc.text('Mobile: '+mobile,14,y);y+=6;
let addrLines=doc.splitTextToSize('Address: '+address,180);doc.text(addrLines,14,y);y+=addrLines.length*5+4;
doc.text('Payment: '+(order.paymentMethod||'Cash on Delivery')+' | Status: '+(order.status||'Pending'),14,y);y+=10;
doc.setFillColor(235,235,235);doc.rect(14,y,182,8,'F');
doc.setFont('helvetica','bold');doc.text('Item',15,y+5);doc.text('Qty',95,y+5);doc.text('Price',120,y+5);doc.text('Total',155,y+5);y+=10;
doc.setFont('helvetica','normal');
items.forEach(it=>{let qty=parseInt(it.qty)||1;let price=parseFloat(it.price)||0;let tot=qty*price;
doc.text((it.name||'Product').substring(0,35)+' ('+(it.size||'M')+')',15,y);doc.text(String(qty),96,y);doc.text('Rs.'+price,121,y);doc.text('Rs.'+tot,156,y);y+=6;
if(y>270){doc.addPage();y=15;}});
y+=4;doc.text('Subtotal: Rs.'+sub+' | Delivery: Rs.'+del,14,y);y+=6;
doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Grand Total: Rs.'+grand,14,y);y+=12;
doc.setFont('helvetica','normal');doc.setFontSize(11);doc.text('Thank You for Ordering from Restro For You',14,y);
doc.save('INVOICE_'+invoiceNo+'.pdf');}
window.downloadInvoice=function(orderId){try{let order=null;
if(window.orderMap&&window.orderMap[orderId])order=window.orderMap[orderId];
else if(window.allOrders)order=window.allOrders.find(o=>o.id===orderId||o.orderId===orderId);
if(!order){alert('Order not found: '+orderId);return;}
if(window.generateInvoicePDF&&window.generateInvoicePDF.toString().length>500){try{window.generateInvoicePDF(order);return;}catch(e){}}

function getDB(){try{if(!firebase.apps.length)firebase.initializeApp(MY_FIREBASE_CONFIG);return firebase.firestore();}catch(e){return null;}}

let latestName=currentCustomerData?.name||localStorage.getItem('popup_name')||'Customer';

let addrLine=latestAddr?`📍 ${latestAddr}${city?', '+city:''}${pincode?' - '+pincode:''}`:'📍 Address not added';
box.innerHTML=`<div class="customer-profile"><div style="width:42px;height:42px;border-radius:50%;background:#ff6a00;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px">${(latestName[0]||'C').toUpperCase()}</div><div style="flex:1"><div style="font-weight:bold">👤 ${latestName} - ${allOrders.length} Orders</div><div style="font-size:11px;color:#444;margin-top:3px">📱 ${mob}${extra?` | 📦 Extra: ${extra}`:''}${email?` | ✉️ ${email}`:''}</div><div style="font-size:11px;background:#fff8e1;padding:6px 8px;border-radius:6px;margin-top:5px;border:1px dashed #ff6a00">${addrLine} | <button onclick="openAddrPopup()" style="padding:2px 8px;background:#ff6a00;color:#fff;border:none;border-radius:10px;font-size:10px;cursor:pointer">✏️ Edit Address</button></div></div></div>`;}
function getProductImage(it){let fb=['image','imageUrl','img','url','thumbnail'];for(let f of fb){let v=it[f];if(v&&typeof v==='string'&&(v.startsWith('http')||v.startsWith('data:image'))&&v.length>10)return v;}return 'https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=200';}

document.getElementById('otpInput').style.display='none';document.getElementById('otpInfo').style.display='none';
document.getElementById('btnSaveAddr').style.display='none';document.getElementById('btnWaOtp').style.display='block';
document.getElementById('otpInput').value='';pendingNewAddress=null;
document.getElementById('addrPopupOverlay').classList.add('show');document.getElementById('addrPopupOverlay').style.display='flex';}
function closeAddrPopup(){let el=document.getElementById('addrPopupOverlay');el.classList.remove('show');el.style.display='none';}
function requestOtpOnWhatsApp(){let name=document.getElementById('popupName').value.trim();
let login=document.getElementById('popupLogin').value.trim();let extra=document.getElementById('popupExtra').value.trim();
let fullAddr=document.getElementById('popupFullAddr').value.trim();let city=document.getElementById('popupCity').value.trim();
let pincode=document.getElementById('popupPincode').value.trim();let email=document.getElementById('popupEmail').value.trim();
if(!name||name.length<2){alert('👤 Name likho');return;}
if(!login||login.length<10){alert('📱 Mobile 10 digit likho');return;}
if(!fullAddr||fullAddr.length<5){alert('📍 Full Address likho');return;}
let finalAddress=`${fullAddr}${city?', '+city:''}${pincode?' - '+pincode:''}`;
pendingNewAddress={name,login,extra:extra||login,fullAddr,city,pincode,email,finalAddress};
let orderId=allOrders.length?(allOrders[0].orderId||allOrders[0].id):(localStorage.getItem('lastOrderId')||'NEW');
let msg=`*RESTRO FOR YOU - ADDRESS UPDATE*%0AOrder ID: ${orderId}%0AName: ${name}%0AMobile: ${login}%0AExtra: ${extra||login}%0AEmail: ${email}%0A%0A*NEW ADDRESS:*%0A${finalAddress}%0A%0A🔐 *OTP bhejo*`;
window.open(`https://wa.me/918769171078?text=${msg}`,"_blank");
document.getElementById('otpInput').style.display='block';document.getElementById('otpInfo').style.display='block';
document.getElementById('btnSaveAddr').style.display='block';document.getElementById('btnWaOtp').innerText='📲 OTP Dobara Bhejo';}
function saveAddressWithOtp(){let otp=document.getElementById('otpInput').value.trim();
if(!otp||otp.length!==6){alert('🔐 6 Digit OTP dalo');return;}
if(!pendingNewAddress){alert('Pehle address bharo aur OTP request bhejo');return;}
let{name,login,extra,fullAddr,city,pincode,email,finalAddress}=pendingNewAddress;
localStorage.setItem('popup_name',name);localStorage.setItem('restro_name',name);
localStorage.setItem('popup_fulladdr',fullAddr);localStorage.setItem('restro_address',finalAddress);
localStorage.setItem('popup_city',city);localStorage.setItem('restro_city',city);
localStorage.setItem('popup_pincode',pincode);localStorage.setItem('restro_pincode',pincode);
localStorage.setItem('popup_email',email);localStorage.setItem('restro_email',email);
localStorage.setItem('restro_mobile',login);localStorage.setItem('customer_mobile',login);
localStorage.setItem('restro_deliveryMobile',extra);localStorage.setItem('lastOrderAddress',finalAddress);
try{let cust={name,loginMobile:login,mobile:login,deliveryMobile:extra,email,address:finalAddress,fullAddress:finalAddress,city,pincode,addressOtp:otp};localStorage.setItem('restro_customer',JSON.stringify(cust));}catch(e){}
closeAddrPopup();alert(`✅ Address Saved\n${finalAddress}`);showCustomerProfile();loadOrdersClean();}
async function loadProductCacheThenOrders(){try{let snap=await db.collection('restro_products').limit(400).get();snap.forEach(d=>{let data=d.data();let img=data.image||data.imageUrl||'';if(img){productCache[d.id]=img;if(data.name)productCache[data.name.toLowerCase()]=img;}});}catch(e){}loadOrdersClean();}
function getFullAddressAuto(order){let addr=order.address||order.customerAddress||order.fullAddress||'';
if(addr&&addr.length>5)return addr;
let autoFull=localStorage.getItem('popup_fulladdr')||localStorage.getItem('restro_address')||'';
let autoCity=localStorage.getItem('popup_city')||'';let autoPin=localStorage.getItem('popup_pincode')||'';
if(autoFull)return `${autoFull}${autoCity?', '+autoCity:''}${autoPin?' - '+autoPin:''}`;
return `Address not added`;}
function loadOrdersClean(){let mobile=currentCustomerMobile||'';
document.getElementById('statusBar').innerHTML=`Loading orders for ${mobile}...`;orderMap={};
try{let lastCart=JSON.parse(localStorage.getItem('lastOrderCartBackup')||'[]');
let lastId=localStorage.getItem('lastOrderId')||'';
/* ✅ FIX - OLD CODE SAVE - pehle sirf (lastCart.length && lastId) tha - ab RESTRO check add - SM block */
if(lastCart.length&&lastId&&String(lastId).toUpperCase().startsWith('RESTRO')){
orderMap[lastId]={id:lastId,orderId:lastId,dateStr:new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}),date:new Date().toISOString(),items:lastCart,cart:lastCart,total:lastCart.reduce((s,it)=>s+(parseFloat(it.price)||0)*(parseInt(it.qty)||1),0),grandTotal:lastCart.reduce((s,it)=>s+(parseFloat(it.price)||0)*(parseInt(it.qty)||1),0)+80,subtotal:lastCart.reduce((s,it)=>s+(parseFloat(it.price)||0)*(parseInt(it.qty)||1),0),mobile:mobile,loginMobile:mobile,customerMobile:mobile,address:localStorage.getItem('popup_fulladdr')||'',status:'Pending',isLocal:true,createdAt:firebase.firestore.Timestamp.now?firebase.firestore.Timestamp.now():{toMillis:()=>Date.now()},};}}catch(e){}
let totalQueries=7,done=0;
function checkDone(){done++;if(done>=totalQueries)renderFromMapClean();}
function renderFromMapClean(){let arr=Object.values(orderMap);
/* ✅ FIX - OLD CODE SAVE - pehle filter nahi tha - ab RESTRO ONLY - SM hide */
arr=arr.filter(o=>{let id=String(o.id||o.orderId||'').toUpperCase();return o.isLocal||id.startsWith('RESTRO');});

arr.forEach((o,i)=>{o._serial=arr.length-i;});
allOrders=arr;window.allOrders=arr;window.orderMap=orderMap;showCustomerProfile();renderOrders(arr);
document.getElementById('statusBar').innerHTML=`${arr.length} Orders Found - Mobile: ${mobile}`;}
if(!db){renderFromMapClean();return;}
db.collection('orders').where('customerMobile','==',mobile).get().then(s=>{s.forEach(d=>{orderMap[d.id]={...orderMap[d.id],id:d.id,...d.data()};});checkDone();}).catch(()=>{checkDone();});
db.collection('orders').where('mobile','==',mobile).get().then(s=>{s.forEach(d=>{orderMap[d.id]={...orderMap[d.id],id:d.id,...d.data()};});checkDone();}).catch(()=>{checkDone();});
db.collection('orders').where('loginMobile','==',mobile).get().then(s=>{s.forEach(d=>{orderMap[d.id]={...orderMap[d.id],id:d.id,...d.data()};});checkDone();}).catch(()=>{checkDone();});
db.collection('restro_orders').where('mobile','==',mobile).get().then(s=>{s.forEach(d=>{orderMap[d.id]={...orderMap[d.id],id:d.id,...d.data()};});checkDone();}).catch(()=>{checkDone();});
db.collection('restro_orders').where('loginMobile','==',mobile).get().then(s=>{s.forEach(d=>{orderMap[d.id]={...orderMap[d.id],id:d.id,...d.data()};});checkDone();}).catch(()=>{checkDone();});
db.collection('restro_orders').where('customerMobile','==',mobile).get().then(s=>{s.forEach(d=>{orderMap[d.id]={...orderMap[d.id],id:d.id,...d.data()};});checkDone();}).catch(()=>{checkDone();});
db.collection('orders').orderBy('date','desc').limit(60).get().then(s=>{s.forEach(d=>{let data=d.data();if(data.mobile===mobile||data.loginMobile===mobile||data.customerMobile===mobile||!data.mobile){if(!orderMap[d.id])orderMap[d.id]={id:d.id,...data};}});checkDone();}).catch(()=>{checkDone();});
setTimeout(()=>{if(done<totalQueries){renderFromMapClean();}},5000);}
function calculateTotal(o){let f=['total','totalAmount','grandTotal','orderTotal','amount'];for(let x of f){let v=parseFloat(o[x]||0);if(v>0)return v;}let items=o.items||o.cart||[];if(!Array.isArray(items))try{items=Object.values(items);}catch(e){items=[];}let sum=0;items.forEach(it=>sum+=(parseInt(it.qty||1)||1)*(parseFloat(it.price||0)||0));return sum;}
function getShortStatus(s){s=(s||'Pending').toLowerCase();if(s.includes('cancel request'))return 'Cancel Requested';if(s.includes('cancel'))return 'Cancelled';if(s.includes('delivered'))return 'Delivered';if(s.includes('out for'))return 'Out for Delivery';if(s.includes('ship'))return 'Shipped';if(s.includes('confirm'))return 'Confirmed';return 'Pending';}
function getPaymentMethod(o){let p=(o.paymentMethod||o.paymentMode||'Cash on Delivery');if(p.toLowerCase().includes('online'))return 'Online Payment';return 'Cash on Delivery';}
function renderOrders(orders){
if(!orders||orders.length===0){document.getElementById('ordersList').innerHTML=`<div style="text-align:center;padding:30px;background:#fff;border-radius:12px">📦 No Orders Found<br><button onclick="location.href='index.html'" style="padding:10px 20px;background:#ff6a00;color:#fff;border:none;border-radius:8px;margin-top:10px;cursor:pointer">🏠 Go to Menu</button></div>`;return;}
document.getElementById('ordersList').innerHTML=orders.map((order)=>{
let serial=order._serial||1;
let d=order.createdAt?.toDate?.()||new Date(order.date||Date.now());
let dateStr=d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
let total=calculateTotal(order);let payment=getPaymentMethod(order);
let isOnline=payment.toLowerCase().includes('online');
let loginMob=order.loginMobile||order.customerMobile||order.mobile||currentCustomerMobile||'';
let deliveryMob=order.deliveryMobile||'';let fullAddr=getFullAddressAuto(order);
let name=order.customerName||order.name||localStorage.getItem('popup_name')||'Customer';
let items=order.items||order.cart||[];if(!Array.isArray(items))try{items=Object.values(items);}catch(e){items=[];}
let sub=0;items.forEach(it=>sub+=(parseInt(it.qty||1)||1)*(parseFloat(it.price||0)||0));
let del=sub>=500?0:80;let grand=sub+del;if(order.grandTotal)grand=order.grandTotal;if(order.total)grand=order.total;
let itemsHTML=items.map(it=>{let q=parseInt(it.qty||1)||1,p=parseFloat(it.price||0)||0,nameP=it.name||'Product';
let img=getProductImage(it);
return `<div class="item-row"><div class="item-img-wrap"><img src="${img}" onerror="this.src='https://via.placeholder.com/100'"></div><div style="flex:1"><h4 style="font-size:13px">${nameP}</h4><p style="font-size:11px;color:#666">Qty: ${q} | ₹${p} = ₹${q*p} | Size: ${it.size||'M'}</p></div></div>`;}).join('');
let status=getShortStatus(order.status);
let statusClass=status==='Confirmed'?'status-confirmed':status==='Cancelled'?'status-cancelled':status==='Cancel Requested'?'status-cancel-req':'status-pending';
let shortId=String(order.id).slice(-6).toUpperCase();
let isCancelRequested=status==='Cancel Requested'||order.cancelRequest;
let hasOrderOTP=!!(order.otp||order.customerOTP);let hasCancelOTP=!!(order.cancelOTP);
let showCancelOtp=(isCancelRequested&&!hasCancelOTP)?'block':'none';
let showMainOtp=(status==='Pending'&&!hasOrderOTP&&!isCancelRequested)?'block':'none';
let savedOrderOTPBox=hasOrderOTP?`<div class="saved-otp-box">✅ WhatsApp Order OTP Saved</div>`:'';
let savedCancelOTPBox=hasCancelOTP?`<div class="saved-cancel-box">✅ WhatsApp Cancel OTP Saved</div>`:'';
let topLine=`ID: <b>${order.id}</b> | ${dateStr} | 📱 <b>${loginMob}</b> ${order.isLocal?'<span style="background:#10b981;color:#fff;padding:2px 6px;border-radius:10px;font-size:9px">NEW</span>':''}`;
return `<div class="order-card">
<div class="order-header">
<div class="order-header-top"><div style="display:flex;gap:6px;align-items:center"><span class="serial-badge">#${serial}</span><div class="order-id-badge">Order #${shortId}</div></div>
<div class="status-wrap"><span class="status-badge ${statusClass}">${status}</span><span class="payment-badge payment-cod">${isOnline?'💳 Online':'💵 COD'}</span><button class="btn-cancel-top" onclick="showCancelBox('${order.id}')">❌ Cancel</button></div></div>
<div class="order-id-line">${topLine}</div>
<div class="order-addr-line">📍 ${fullAddr}${deliveryMob?` | 📦 Extra: ${deliveryMob}`:''}</div>
<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="small-tab" onclick="toggleAddr('addr_${order.id}')">📍 Delivery Profile View</button><button class="small-tab" onclick="downloadInvoice('${order.id}')">📄 Invoice PDF</button><button class="small-tab" onclick="window.open('inquiry.html?orderId=${order.id}','_blank')">🆘 Help / Inquiry</button></div>
<div id="addr_${order.id}" class="addr-full">👤 Name: ${name}\n📱 Mobile: ${loginMob}\n📦 Extra: ${deliveryMob}\n📍 Address: ${fullAddr}\n📅 Date: ${dateStr}</div>
</div>
${itemsHTML}
<div class="total-section"><div class="total-row"><span>Subtotal</span><span>₹${sub}</span></div><div class="total-row"><span>Delivery</span><span>${del===0?'FREE':'₹'+del}</span></div><div class="total-row grand-total"><span>Grand Total - ${payment}</span><span>₹${grand||total}</span></div></div>
<button type="button" class="btn-track" onclick="openTrackingPage('${order.id}')">📦 Tracking</button>
<button type="button" class="btn-invoice" onclick="downloadInvoice('${order.id}')">📄 Download Invoice</button>
<div id="cancelBox_${order.id}" class="cancel-box" style="display:none"><div style="font-weight:bold;color:#991b1b;text-align:center;font-size:13px">❌ Cancel Reason</div><textarea id="cancel_reason_${order.id}" class="cancel-input" placeholder="Cancel reason likho..."></textarea><button class="btn-cancel-confirm" onclick="confirmCancel('${order.id}')">❌ Confirm Cancel</button><button class="btn-whatsapp-cancel" onclick="whatsappCancel('${order.id}')">📲 WhatsApp Cancel + OTP Request</button></div>
${savedCancelOTPBox}
<div id="cancelOtpBox_${order.id}" class="otp-cancel-box" style="display:${showCancelOtp}"><div style="font-weight:bold;color:#991b1b;text-align:center;font-size:13px">🔐 Cancel OTP</div><input id="cancel_otp_${order.id}" class="otp-input-cancel" placeholder="------" maxlength="6" value=""><button class="btn-save-cancel" onclick="saveCancelOTP('${order.id}')">💾 Save Cancel OTP</button></div>
${savedOrderOTPBox}
<div id="mainOtpBox_${order.id}" class="otp-box" style="display:${showMainOtp}"><div style="font-weight:bold;color:#065f46;text-align:center;font-size:12px">WhatsApp OTP</div><input id="order_otp_${order.id}" class="otp-input" placeholder="------" maxlength="6" value=""><button class="btn-verify" onclick="verifyOTP('${order.id}')">✅ Verify & Save OTP</button></div>
</div>`;}).join('');}
function toggleAddr(id){let el=document.getElementById(id);if(el)el.style.display=el.style.display==='block'?'none':'block';}
function showCancelBox(id){let el=document.getElementById('cancelBox_'+id);if(el)el.style.display=el.style.display==='none'?'block':'none';}
function closeCancelBox(id){let el=document.getElementById('cancelBox_'+id);if(el)el.style.display='none';}
function confirmCancel(id){let reason=document.getElementById('cancel_reason_'+id)?.value.trim();
if(!reason){alert('Cancel reason likho');return;}
if(confirm('Cancel confirm karna hai?')){db.collection('orders').doc(id).update({cancelRequest:true,cancelReason:reason,status:'Cancel Requested'}).then(()=>{alert('✅ Cancel request bheja gaya');loadOrdersClean();});
db.collection('restro_orders').doc(id).update({cancelRequest:true,cancelReason:reason,status:'Cancel Requested'}).catch(()=>{});}}
function whatsappCancel(id){let reason=document.getElementById('cancel_reason_'+id)?.value.trim()||'Cancel karna hai';
let txt=`*RESTRO FOR YOU - Cancel Request*%0AOrder ID: ${id}%0AReason: ${reason}%0AMobile: ${currentCustomerMobile}%0A%0A❌ *Cancel OTP bhejo*`;
window.open('https://wa.me/918769171078?text='+txt,'_blank');
document.getElementById('cancelBox_'+id).style.display='none';
document.getElementById('cancelOtpBox_'+id).style.display='block';
let mainOtp=document.getElementById('mainOtpBox_'+id);if(mainOtp)mainOtp.style.display='none';
db.collection('orders').doc(id).update({cancelRequest:true,cancelReason:reason,status:'Cancel Requested'}).catch(()=>{});
db.collection('restro_orders').doc(id).update({cancelRequest:true,cancelReason:reason,status:'Cancel Requested'}).catch(()=>{});}
function verifyOTP(id){let otp=document.getElementById('order_otp_'+id).value.trim();
if(otp.length!=6)return alert('6 digit OTP likho');
let order=allOrders.find(o=>o.id===id)||{};
let login=order.loginMobile||order.customerMobile||order.mobile||currentCustomerMobile||'';
let nowStr=new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
let upd={otp:otp,customerOTP:otp,otpSavedByCustomer:true,otpSaveTime:nowStr,verifiedAt:Date.now()};
db.collection('orders').doc(id).update(upd).then(()=>{alert('✅ WhatsApp Order OTP Saved');loadOrdersClean();}).catch(()=>{db.collection('restro_orders').doc(id).update(upd).then(()=>{alert('✅ WhatsApp Order OTP Saved');loadOrdersClean();});});}
function saveCancelOTP(id){let otp=document.getElementById('cancel_otp_'+id).value.trim();
if(otp.length!=6)return alert('6 digit Cancel OTP likho');
let nowStr=new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
let upd={cancelOTP:otp,cancelOTPSavedByCustomer:true,cancelOTPSaveTime:nowStr};
db.collection('orders').doc(id).update(upd).then(()=>{alert('✅ WhatsApp Cancel OTP Saved');loadOrdersClean();}).catch(()=>{db.collection('restro_orders').doc(id).update(upd).then(()=>{alert('✅ WhatsApp Cancel OTP Saved');loadOrdersClean();});});}
function sendHelpWA(type,orderId){let mobile=localStorage.getItem('restro_mobile')||currentCustomerMobile||'';
let msg=`*RESTRO FOR YOU - HELP REQUEST*%0A%0AType: ${type}%0AOrder ID: ${orderId}%0AMobile: ${mobile}%0A%0AMujhe is order me help chahiye. Please reply.`;
window.open("https://wa.me/918769171078?text="+msg,'_blank');}
document.addEventListener("DOMContentLoaded",function(){checkLoginAndLoad();
document.getElementById('addrPopupOverlay').addEventListener('click',function(e){if(e.target===this)closeAddrPopup();});});
</script>
