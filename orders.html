<style>
:root{--bg:#fff8e1;--card:#fff;--accent:#ff6a00;--green:#10b981}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:var(--bg);padding-bottom:70px}
.header{background:var(--accent);color:#fff;padding:12px 15px;display:flex;gap:8px;position:sticky;top:0;z-index:100;align-items:center}
.header h1{font-size:14px;flex:1}
.back-btn,.logout-btn,.profile-btn{background:rgba(255,255,255,.25);border:none;color:#fff;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:bold}
.container{max-width:900px;margin:12px auto;padding:0 10px}
.customer-profile{background:var(--card);padding:12px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);border-left:5px solid var(--green);display:flex;gap:10px;align-items:center}
.order-card{background:var(--card);margin:14px 0;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);border-left:5px solid var(--accent)}
.order-header{padding-bottom:10px;border-bottom:2px dashed #fff3e0;margin-bottom:10px}
.order-header-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.order-id-badge{background:var(--accent);color:#fff;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:bold}
.serial-badge{background:#1a1a2e;color:#fff;padding:5px 10px;border-radius:12px;font-size:10px;font-weight:bold}
.order-id-line{font-size:11px;color:#333;margin-top:8px;line-height:1.6;background:#fff3e0;padding:6px 8px;border-radius:8px 8px 0 0;border:1px solid #ffe0b2;border-bottom:none}
.order-addr-line{font-size:11px;color:#333;background:#fffef5;padding:6px 8px;border-radius:0 0 8px 8px;border:1px solid #ffe0b2;border-top:none;line-height:1.5}
.status-wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.status-badge{padding:5px 12px;border-radius:20px;font-size:10px;font-weight:bold}
.payment-badge{padding:5px 10px;border-radius:20px;font-size:10px;font-weight:bold}
.payment-cod{background:#e0f2fe;color:#0284c7;border:1px solid #bae6fd}
.payment-online{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.status-pending{background:#fef3c7;color:#92400e}.status-confirmed{background:#d1fae5;color:#065f46}.status-shipped{background:#dbeafe;color:#1e40af}.status-cancelled{background:#fee2e2;color:#991b1b}
.item-row{display:flex;gap:10px;margin:8px 0;padding:10px;background:#fafafa;border-radius:10px;align-items:center;border:1px solid #fff3e0}
.item-img-wrap{width:58px;height:58px;border-radius:10px;background:#fff;border:1px solid #eee;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.item-img-wrap img{width:100%;height:100%;object-fit:cover}
.prod-link-btn{display:inline-block;margin-top:4px;padding:3px 8px;background:#e0f2fe;color:#0284c7;border-radius:20px;font-size:9px;font-weight:bold;text-decoration:none}
.screenshot-box{background:#fffff7;border:1.5px dashed #f59e0b;border-radius:10px;padding:10px;margin:10px 0;font-size:11px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.total-section{border-top:2px solid #fff3e0;margin-top:8px;padding-top:8px}
.total-row{display:flex;justify-content:space-between;margin:3px 0;font-size:12px}.grand-total{font-size:14px;font-weight:bold;color:var(--accent)}
.addr-popup-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:none;align-items:center;justify-content:center;padding:12px}
.addr-popup-box{background:#fff;border-radius:16px;padding:16px;max-width:460px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,0.4);border:2.5px solid #ff6a00;max-height:92vh;overflow-y:auto}
</style>

function getProductImage(it){
  let fbFields=['image','imageUrl','img','url','thumbnail'];
  for(let f of fbFields){let v=it[f];if(v&&typeof v==='string'&&(v.startsWith('http')||v.startsWith('data:image')||v.startsWith('data:'))&&v.length>10) return v;}
  try{let k=(it.name||'').toLowerCase(); if(k&&productCache[k]) return productCache[k];}catch(e){}
  return 'https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=200';
}

async function loadProductCacheThenOrders(){
  try{
    let snap=await db.collection('restro_products').limit(400).get();
    snap.forEach(d=>{let data=d.data(); let img=data.image||data.imageUrl||''; if(img){ productCache[d.id]=img; if(data.name) productCache[data.name.toLowerCase()]=img; }});
  }catch(e){}
  loadOrdersClean();
}

// ✅ CLEAN - AUTO ADDRESS - Jab address nahi dikhe to automatically add - Par UI me version nahi dikhega - Saf sutra
function getFullAddressAuto(order){
  let addr = order.address||order.customerAddress||order.fullAddress||order.deliveryAddress||order.addressLine||'';
  if(addr && addr.length>5 && !addr.includes('Missing')){
    return addr;
  }
  // Auto fill from localStorage - Jab address nahi dikhe to koi bhi address add nahi ho - Iska fix - Automatically
  let autoFull = localStorage.getItem('popup_fulladdr') || localStorage.getItem('santra_address') || localStorage.getItem('lastOrderAddress') || '';
  let autoCity = localStorage.getItem('popup_city') || 'Jaipur, Rajasthan';
  let autoPin = localStorage.getItem('popup_pincode') || '302012';
  
  if(autoFull && autoFull.length>3){
    let fullAuto = `${autoFull}, ${autoCity} - ${autoPin}`;
    order.address = fullAuto;
    order.customerAddress = fullAuto;
    order.fullAddress = fullAuto;
    return fullAuto;
  }
  return `Address not added - Click Edit to add your delivery address`;
}

function loadOrdersClean(){
  let mobile = currentCustomerMobile || '9660834888';
  document.getElementById('statusBar').innerHTML = `Loading orders for ${mobile}...`;
  orderMap = {};

  try{
    let lastCart=JSON.parse(localStorage.getItem('lastOrderCartBackup')||'[]');
    let lastId=localStorage.getItem('lastOrderId')||'';
    if(lastCart.length && lastId){
      orderMap[lastId]={
        id:lastId, orderId:lastId,
        dateStr:new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}),
        date:new Date().toISOString(),
        items:lastCart, cart:lastCart,
        total:lastCart.reduce((s,it)=>s+(parseFloat(it.price)||0)*(parseInt(it.qty)||1),0),
        grandTotal:lastCart.reduce((s,it)=>s+(parseFloat(it.price)||0)*(parseInt(it.qty)||1),0)+30,
        subtotal:lastCart.reduce((s,it)=>s+(parseFloat(it.price)||0)*(parseInt(it.qty)||1),0),
        mobile:mobile, loginMobile:mobile, customerMobile:mobile,
        address: localStorage.getItem('popup_fulladdr')||localStorage.getItem('lastOrderAddress')||'45, Sastrasardar, Lachu',
        customerAddress: localStorage.getItem('popup_fulladdr')||'',
        fullAddress: localStorage.getItem('popup_fulladdr')||'',
        status:'Pending',
        isLocal:true,
        createdAt: firebase.firestore.Timestamp.now ? firebase.firestore.Timestamp.now() : {toMillis:()=>Date.now()},
        timestamp: firebase.firestore.Timestamp.now ? firebase.firestore.Timestamp.now() : {toMillis:()=>Date.now()}
      };
    }
  }catch(e){}

  let totalQueries=7;
  let done=0;
  function checkDone(){
    done++;
    document.getElementById('statusBar').innerHTML=`Loading ${done}/${totalQueries} - Found ${Object.keys(orderMap).length} orders`;
    if(done>=totalQueries) renderFromMapClean();
  }
  function renderFromMapClean(){
    let arr = Object.values(orderMap);
    arr.sort((a,b)=>{
      let ta = a.createdAt?.toMillis?.() || a.timestamp?.toMillis?.() || new Date(a.date||0).getTime() || 0;
      let tb = b.createdAt?.toMillis?.() || b.timestamp?.toMillis?.() || new Date(b.date||0).getTime() || 0;
      return tb - ta;
    });
    arr.forEach((o,i)=>{ o._serial = arr.length - i; });
    allOrders = arr; showCustomerProfile(); renderOrdersClean(arr);
    document.getElementById('statusBar').innerHTML = `${arr.length} Orders Found - Mobile: ${mobile}`;
  }

  db.collection('orders').where('customerMobile','==',mobile).get().then(s=>{ s.forEach(d=>{ orderMap[d.id] = {...orderMap[d.id], id:d.id, ...d.data()}; }); checkDone(); }).catch(()=>{checkDone();});
  db.collection('orders').where('mobile','==',mobile).get().then(s=>{ s.forEach(d=>{ orderMap[d.id] = {...orderMap[d.id], id:d.id, ...d.data()}; }); checkDone(); }).catch(()=>{checkDone();});
  db.collection('orders').where('loginMobile','==',mobile).get().then(s=>{ s.forEach(d=>{ orderMap[d.id] = {...orderMap[d.id], id:d.id, ...d.data()}; }); checkDone(); }).catch(()=>{checkDone();});
  db.collection('restro_orders').where('mobile','==',mobile).get().then(s=>{ s.forEach(d=>{ orderMap[d.id] = {...orderMap[d.id], id:d.id, ...d.data()}; }); checkDone(); }).catch(()=>{checkDone();});
  db.collection('restro_orders').where('loginMobile','==',mobile).get().then(s=>{ s.forEach(d=>{ orderMap[d.id] = {...orderMap[d.id], id:d.id, ...d.data()}; }); checkDone(); }).catch(()=>{checkDone();});
  db.collection('restro_orders').where('customerMobile','==',mobile).get().then(s=>{ s.forEach(d=>{ orderMap[d.id] = {...orderMap[d.id], id:d.id, ...d.data()}; }); checkDone(); }).catch(()=>{checkDone();});
  db.collection('orders').orderBy('date','desc').limit(60).get().then(s=>{
    s.forEach(d=>{
      let data=d.data();
      if(data.mobile===mobile || data.loginMobile===mobile || data.customerMobile===mobile || !data.mobile || data.loginMobile==='9660834888' || data.mobile==='9660834888'){
        if(!orderMap[d.id]) orderMap[d.id]={id:d.id,...data};
      }
    });
    checkDone();
  }).catch(()=>{checkDone();});

  setTimeout(()=>{ if(done<totalQueries){ renderFromMapClean(); } }, 5000);
}

function calculateTotal(o){let f=['total','totalAmount','grandTotal','orderTotal','amount'];for(let x of f){let v=parseFloat(o[x]||0);if(v>0)return v;}let items=o.items||o.cart||[];if(!Array.isArray(items))try{items=Object.values(items);}catch(e){items=[];}let sum=0;items.forEach(it=>sum+=(parseInt(it.qty||1)||1)*(parseFloat(it.price||0)||0));return sum;}
function getCleanProductId(it){let raw=(it.id||it.productId||it.code||'').toString().trim();if(!raw) raw=(it.name||'').toString().trim();return raw;}
function getShortStatus(s){s=(s||'Pending').toLowerCase();if(s.includes('cancel request'))return 'Cancel Requested';if(s.includes('cancel'))return 'Cancelled';if(s.includes('delivered'))return 'Delivered';if(s.includes('out for'))return 'Out for Delivery';if(s.includes('ship'))return 'Shipped';if(s.includes('confirm'))return 'Confirmed';return 'Pending';}
function getPaymentMethod(o){let p=(o.paymentMethod||o.paymentMode||'Cash on Delivery'); if(p.toLowerCase().includes('online')) return 'Online Payment'; return 'Cash on Delivery';}
